<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS LLM Chatbox</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      background-color: #fafafa;
      color: #1a1a1a;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 1.35rem;
    }

    #chat-box {
      border: 1px solid #d4d4d8;
      background-color: #ffffff;
      border-radius: 10px;
      height: 440px;
      overflow-y: auto;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 82%;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      background-color: #007bff;
      color: #ffffff;
      align-self: flex-end;
    }

    .model {
      background-color: #f1f5f9;
      color: #1e293b;
      align-self: flex-start;
    }

    .error {
      background-color: #fee2e2;
      color: #991b1b;
      align-self: flex-start;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #007bff;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background-color: #0062cc;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <h2>JS LLM Chatbox</h2>
  <div id="chat-box"></div>

  <form id="chat-form">
    <input type="text" id="user-input" placeholder="Type a message..." required autocomplete="off" />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    let lastInteractionId = null;

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage('user', message);
      userInput.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            previousInteractionId: lastInteractionId,
          }),
        });

        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || 'Failed to get response from server');
        }

        if (data.interactionId) {
          lastInteractionId = data.interactionId;
        }

        appendMessage('model', data.reply);
      } catch (err) {
        appendMessage('error', `Error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>

</html>
